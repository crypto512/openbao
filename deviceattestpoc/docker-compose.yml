
# ACME Device Attestation PoC - Docker Compose Configuration

services:
  # Software TPM 2.0 - Provides TPM functionality for client attestation
  tpm1:
    build:
      context: ./swtpm
      dockerfile: Dockerfile
    container_name: swtpm-tpm1
    hostname: tpm1
    volumes:
      - swtpm-state:/tmp/swtpm-state
      - ./ca/swtpm-manufacturer/RootCA:/app/ca/root:ro
      - ./ca/swtpm-manufacturer/IntermediateCA:/app/ca/intermediate:ro
    networks:
      - attestation-net
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 1 nc 127.0.0.1 2321 < /dev/null && timeout 1 nc 127.0.0.1 2322 < /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # OpenBao Server - Secrets Management and ACME Certificate Authority
  openbao:
    build:
      context: ..
      dockerfile: deviceattestpoc/openbao/Dockerfile
    container_name: openbao-poc
    hostname: openbao
    ports:
      - "8200:8200"
    environment:
      - BAO_LOG_LEVEL=debug
    volumes:
      - ./scripts:/scripts:ro
      - openbao-data:/openbao/data
    healthcheck:
      # Check if sealed (501) or unsealed (200) - both mean server is running
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedok=true&uninitok=true"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - attestation-net

  # Initialization Service - Configures OpenBao with PKI and TPM EK roots
  init:
    build:
      context: ..
      dockerfile: deviceattestpoc/openbao/Dockerfile
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      - BAO_ADDR=http://openbao:8200
    volumes:
      - ./scripts:/scripts:ro
      - openbao-data:/data
    command: /scripts/init-openbao.sh
    networks:
      - attestation-net

  # gRPC Server - Proxies certificate requests to OpenBao ACME API
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cert-server
    hostname: server
    ports:
      - "50051:50051"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - BAO_ADDR=http://openbao:8200
      - GRPC_PORT=50051
      - LOG_LEVEL=debug
      - BAO_KEYS_FILE=/openbao-data/openbao-keys.json
    volumes:
      - ./ca:/ca:ro
      - server-acme-accounts:/data/acme-accounts
      - openbao-data:/openbao-data:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - attestation-net

  # Client - Device attestation tools (SWTPM)
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cert-client
    hostname: client
    depends_on:
      tpm1:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      - GRPC_SERVER=server:50051
      - LOG_LEVEL=debug
      - TPM2TOOLS_TCTI=swtpm:host=tpm1,port=2321
      - TPM_SWTPM_HOST=tpm1
      - TPM_SWTPM_PORT=2321
      - DA_JSON_PATH=/etc/da/da.json
      - DA_OUTPUT_DIR=/certs
    volumes:
      - client-certs:/certs
      - client-da-config:/etc/da
      - ./ca:/ca:ro
    networks:
      - attestation-net

  # Client - Hardware TPM with device passthrough (for real TPM chips)
  client-hw:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cert-client-hw
    hostname: client-hw
    depends_on:
      server:
        condition: service_started
    environment:
      - GRPC_SERVER=server:50051
      - LOG_LEVEL=debug
      - TPM2TOOLS_TCTI=device:/dev/tpmrm0
      - DA_JSON_PATH=/etc/da/da.json
      - DA_OUTPUT_DIR=/certs
    devices:
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
    privileged: true
    volumes:
      - client-certs:/certs
      - client-hw-da-config:/etc/da
      - ./ca:/ca:ro
    networks:
      - attestation-net
    profiles:
      - hardware

networks:
  attestation-net:
    driver: bridge

volumes:
  openbao-data:
  client-certs:
  client-da-config:
  client-hw-da-config:
  swtpm-state:
  server-acme-accounts:
