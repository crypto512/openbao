
# ACME Device Attestation PoC - Docker Compose Configuration

services:
  # Software TPM 2.0 - Provides TPM functionality for client attestation
  tpm1:
    build:
      context: ./swtpm
      dockerfile: Dockerfile
    container_name: swtpm-tpm1
    hostname: tpm1
    volumes:
      - swtpm-state:/tmp/swtpm-state
      - ./ca/swtpm-manufacturer/RootCA:/app/ca/root:ro
      - ./ca/swtpm-manufacturer/IntermediateCA:/app/ca/intermediate:ro
    networks:
      - attestation-net
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 1 nc 127.0.0.1 2321 < /dev/null && timeout 1 nc 127.0.0.1 2322 < /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # OpenBao Server - Secrets Management and ACME Certificate Authority
  openbao:
    build:
      context: ..
      dockerfile: deviceattestpoc/openbao/Dockerfile
    container_name: openbao-poc
    hostname: openbao
    ports:
      - "8200:8200"
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=root
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - BAO_LOG_LEVEL=debug
    volumes:
      - ./scripts:/scripts:ro
      - openbao-data:/openbao/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - attestation-net

  # Initialization Service - Configures OpenBao with PKI and TPM EK roots
  init:
    build:
      context: ..
      dockerfile: deviceattestpoc/openbao/Dockerfile
    container_name: openbao-init
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      - BAO_ADDR=http://openbao:8200
      - BAO_TOKEN=root
    volumes:
      - ./scripts:/scripts:ro
    command: /scripts/init-openbao.sh
    networks:
      - attestation-net

  # gRPC Server - Proxies certificate requests to OpenBao ACME API
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: cert-server
    hostname: server
    ports:
      - "50051:50051"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - BAO_ADDR=http://openbao:8200
      - BAO_TOKEN=root
      - GRPC_PORT=50051
      - LOG_LEVEL=debug
    networks:
      - attestation-net

  # Client - Requests certificates using TPM attestation (SWTPM)
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cert-client
    hostname: client
    depends_on:
      tpm1:
        condition: service_healthy
      server:
        condition: service_started
    environment:
      - SERVER_ADDR=server:50051
      - CERT_COMMON_NAME=vpn-client-001.example.com
      - LOG_LEVEL=debug
      - TPM2TOOLS_TCTI=swtpm:host=tpm1,port=2321
      - TPM_SWTPM_HOST=tpm1
      - TPM_SWTPM_PORT=2321
    volumes:
      - client-certs:/certs
      - ./ca:/ca:ro
    networks:
      - attestation-net

  # Client - Hardware TPM with device passthrough (for real TPM chips)
  client-hw:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: cert-client-hw
    hostname: client-hw
    depends_on:
      server:
        condition: service_started
    environment:
      - SERVER_ADDR=server:50051
      - CERT_COMMON_NAME=vpn-client-hw.example.com
      - LOG_LEVEL=debug
      - TPM2TOOLS_TCTI=device:/dev/tpmrm0
    devices:
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
    privileged: true
    volumes:
      - client-certs:/certs
      - ./ca:/ca:ro
    networks:
      - attestation-net
    profiles:
      - hardware

networks:
  attestation-net:
    driver: bridge

volumes:
  openbao-data:
  client-certs:
  swtpm-state:
