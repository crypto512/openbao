# swtpm_localca configuration
# Configure to use custom manufacturer CA instead of generating certificates

# State directory for certificate storage
statedir = /var/lib/swtpm-localca

# Signing key (Intermediate CA private key)
signingkey = /etc/swtpm-ca/swtpm-intermediate-ca-key.pem

# Issuer certificate (Intermediate CA certificate)
issuercert = /etc/swtpm-ca/SWTPM TPM EK Intermediate CA.crt

# Certificate serial number file
certserial = /var/lib/swtpm-localca/certserial
