[workspace]
members = ["da-common", "dar-fingerprint", "dar-init", "dar-lak", "dar-agent", "dar-gen"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = ""

[workspace.dependencies]
# TPM 2.0 support - using main branch from GitHub
tss-esapi = { git = "https://github.com/parallaxsecond/rust-tss-esapi", branch = "main" }

# gRPC and protobuf
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tonic-build = "0.12"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ciborium = "0.2"

# Cryptography
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["std", "pem"] }
pem = "3"
rcgen = "0.13"

# TLS
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
tokio-rustls = "0.26"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crate
da-common = { path = "da-common" }
