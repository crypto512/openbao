syntax = "proto3";

package certservice;

option go_package = "github.com/openbao/openbao/deviceattestpoc/proto;certservice";

service CertificateService {
  // ACME-based certificate issuance (TLS only, no client cert required)
  rpc RequestCertificate(CertRequest) returns (CertResponse);
  rpc SubmitAttestation(AttestationSubmit) returns (CertResponse);
  rpc FinalizeOrder(FinalizeRequest) returns (CertResponse);
  rpc GetCertificate(GetCertRequest) returns (CertResponse);

  // TPM enrollment and LAK provisioning (TLS only)
  rpc EnrollTPM(TPMEnrollmentRequest) returns (EnrollmentResponse);
  rpc ProvisionLAK(ProvisionLAKRequest) returns (ProvisionLAKResponse);
  rpc ActivateCredential(ActivateCredentialRequest) returns (ActivateCredentialResponse);

  // mTLS-protected certificate issuance (requires valid agent certificate)
  rpc IssueCertificate(IssueCertRequest) returns (IssueCertResponse);
}

message CertRequest {
  string common_name = 1;
  repeated string san_ips = 2;
  repeated string san_dns = 3;
  string permanent_identifier = 4;
  string usage = 5;  // Certificate usage (e.g., "ipsec-vpn", "wifi") - maps to PKI role
}

message AttestationSubmit {
  string order_id = 1;
  string authorization_url = 2;
  string challenge_url = 3;
  string attestation_object = 4;
}

message FinalizeRequest {
  string order_id = 1;
  string csr_pem = 2;
}

message GetCertRequest {
  string order_id = 1;
}

message CertResponse {
  string status = 1;
  string order_id = 2;
  string authorization_url = 3;
  string challenge_url = 4;
  string challenge_token = 5;
  string account_thumbprint = 6;
  string finalize_url = 7;
  string certificate_pem = 8;
  repeated string chain_pem = 9;
  string error = 10;
  string details = 11;
}

message TPMEnrollmentRequest {
  string ek_certificate_pem = 1;
  string device_description = 2;
}

message EnrollmentResponse {
  string status = 1;
  string error = 2;
  string details = 3;
  string permanent_identifier = 4;
  bool pending_approval = 5;  // True if device needs admin approval before LAK provisioning
}

message ProvisionLAKRequest {
  string permanent_identifier = 1;
  bytes ak_parameters = 2;
  bytes ek_public = 3;
  string ek_cert_pem = 4;
}

message ProvisionLAKResponse {
  string status = 1;
  string error = 2;
  bytes encrypted_credential = 3;
  string session_id = 4;
  string details = 5;
}

message ActivateCredentialRequest {
  string session_id = 1;
  bytes decrypted_secret = 2;
}

message ActivateCredentialResponse {
  string status = 1;
  string error = 2;
  string lak_certificate_pem = 3;
  string lak_root_ca_pem = 4;
  string not_before = 5;
  string not_after = 6;
}

// Request for mTLS-authenticated certificate issuance
message IssueCertRequest {
  string usage = 1;             // Certificate usage (e.g., "vpn", "wifi", "tls")
  string csr_pem = 2;           // PKCS#10 CSR (TPM-signed)
  string common_name = 3;       // Optional CN override
  repeated string san_dns = 4;  // Optional DNS SANs
  repeated string san_ips = 5;  // Optional IP SANs
}

// Response for mTLS-authenticated certificate issuance
message IssueCertResponse {
  string status = 1;            // "success" or "error"
  string error = 2;             // Error message if status is "error"
  string certificate_pem = 3;   // Issued certificate
  string chain_pem = 4;         // CA chain
  string ca_pem = 5;            // Issuing CA certificate
  string not_before = 6;        // Certificate validity start (RFC3339)
  string not_after = 7;         // Certificate validity end (RFC3339)
}
