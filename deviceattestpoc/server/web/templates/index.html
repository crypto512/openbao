{{template "base.html" .}}

{{define "content"}}
<div hx-ext="sse" sse-connect="/events">
    <!-- Status Panel -->
    <div class="card" id="status-panel" hx-get="/api/status" hx-trigger="sse:status-update">
        {{template "status_panel.html" .}}
    </div>

    <!-- Add Device Form -->
    <div class="card">
        <h2>Add Device</h2>
        <form hx-post="/api/devices" hx-target="#device-list" hx-swap="innerHTML" hx-on::after-request="this.reset()">
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="fingerprint">EK Hash / Fingerprint</label>
                    <input type="text" id="fingerprint" name="fingerprint" placeholder="Base64-encoded EK hash from da-fingerprint" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="Optional description">
                </div>
                <div class="form-group" style="flex: 0;">
                    <button type="submit" class="btn btn-primary">Add Device</button>
                </div>
            </div>
        </form>
        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gray-200); display: flex; align-items: center; gap: 12px;">
            <label class="toggle" style="margin: 0;">
                <input type="checkbox" id="auto-approve"
                       onchange="toggleAutoApprove(this.checked)"
                       {{if .AutoApprove}}checked{{end}}>
                <span style="font-size: 0.8rem;">Auto-approve new devices</span>
            </label>
            <span style="font-size: 0.75rem; color: var(--gray-500);">Automatically provision without manual approval</span>
        </div>
    </div>
    <script>
    function toggleAutoApprove(enabled) {
        fetch('/api/settings/auto-approve', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({value: enabled})
        }).then(resp => {
            if (!resp.ok) {
                console.error('Failed to update auto-approve setting');
                document.getElementById('auto-approve').checked = !enabled;
            }
        }).catch(err => {
            console.error('Error updating auto-approve:', err);
            document.getElementById('auto-approve').checked = !enabled;
        });
    }
    </script>

    <!-- Device List -->
    <div class="card">
        <h2>Devices</h2>
        <div id="device-list" hx-get="/api/devices" hx-trigger="sse:device-update">
            {{template "device_list.html" .Devices}}
        </div>
    </div>

    <!-- Audit Log -->
    <div class="card">
        <h2>Recent Activity</h2>
        <div id="audit-log" hx-get="/api/audit?limit=10" hx-trigger="sse:audit-update">
            {{template "audit_log.html" .AuditLog}}
        </div>
    </div>
</div>
{{end}}
