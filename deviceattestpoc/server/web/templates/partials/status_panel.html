{{define "status_panel.html"}}
<!-- SPKI Pin -->
<div style="margin-bottom: 12px;">
    <label style="font-size: 0.8rem; font-weight: 500; color: var(--gray-700);">SPKI Pin (for TOFU bootstrap)</label>
    <div class="spki-box">
        <code>{{.SPKIPin}}</code>
        <button class="btn btn-secondary btn-sm" onclick="copyToClipboard('{{.SPKIPin}}')">Copy</button>
    </div>
</div>

<!-- Stats Pills -->
<div class="stats-grid">
    <div class="stat">
        <span class="stat-value">{{.Status.Total}}</span>
        <span class="stat-label">Total</span>
    </div>
    <div class="stat {{if gt .Status.Registered 0}}stat-secondary{{end}}">
        <span class="stat-value">{{.Status.Registered}}</span>
        <span class="stat-label">Registered</span>
    </div>
    <div class="stat {{if gt .Status.Provisioned 0}}stat-warning{{end}}">
        <span class="stat-value">{{.Status.Provisioned}}</span>
        <span class="stat-label">Provisioned</span>
    </div>
    <div class="stat {{if gt .Status.Enrolled 0}}stat-info{{end}}">
        <span class="stat-value">{{.Status.Enrolled}}</span>
        <span class="stat-label">Enrolled</span>
    </div>
    <div class="stat stat-success">
        <span class="stat-value">{{.Status.Trusted}}</span>
        <span class="stat-label">Trusted</span>
    </div>
</div>
{{end}}
